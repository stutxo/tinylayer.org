[workspace]
members = ["enclave", "client", "wallet"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.100"
argon2 = "=0.5.3"
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
bitcoin = { version = "=0.32.102", default-features = false, features = ["serde", "std"] }
bitcoincore-rpc = "=0.19.0"
chacha20poly1305 = "=0.10.1"
clap = { version = "=4.5.53", features = ["derive"] }
enclavia = { version = "=0.2.0", features = ["json"] }
fs2 = "=0.4.0"
hex = "=0.4.3"
hkdf = "=0.12.4"
http-body-util = "=0.1.5"
rand = "=0.9.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "=7.5.4"
secp256k1 = { version = "=0.29.1", features = ["rand-std", "serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.48.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.3", features = ["util"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
