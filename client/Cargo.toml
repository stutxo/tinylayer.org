[package]
name = "tinylayer-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Reference client for the Tinylayer enclave API"

[features]
default = ["remote"]
remote = ["dep:enclavia", "dep:serde_json"]

[dependencies]
bitcoin.workspace = true
enclavia = { workspace = true, optional = true }
rand.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tinylayer-enclave = { path = "../enclave" }

[dev-dependencies]
bytes = "=1.12.1"
enclavia-protocol = { version = "=0.2.0", features = ["test-utils"] }
futures-util = "=0.3.34"
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = "=0.26.2"

[[test]]
name = "remote"
path = "tests/remote.rs"
required-features = ["remote"]
